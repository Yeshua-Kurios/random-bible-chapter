name: PAR dry run

on:
  push:
    branches: [par-pilot]
    paths:
      - par/pipeline/**
      - .github/workflows/par-dryrun.yml
  workflow_dispatch:
    inputs:
      osis:
        description: OSIS book id for the Hebrew source (e.g. Ps)
        default: Ps
      chapter:
        description: Chapter number
        default: "23"
      kjv_file:
        description: Matching file name in kjv/ (e.g. psalms)
        default: psalms

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run dry run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 par/pipeline/dryrun.py --osis "${{ inputs.osis || 'Ps' }}" --chapter "${{ inputs.chapter || '23' }}" --kjv-file "${{ inputs.kjv_file || 'psalms' }}" --out par/dryrun
      - uses: actions/upload-artifact@v4
        with:
          name: par-dryrun
          path: par/dryrun/
