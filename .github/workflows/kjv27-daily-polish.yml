name: KJV27 daily polish

# True 5:00 am America/New_York year-round (EDT or EST), not a fixed UTC offset. GitHub cron is UTC
# and best-effort, so this fires every hour from 09:00 to 10:00 UTC (5 am EDT first, 5 am EST as a
# fallback) and the "Is it time?" step below lets the run through only once local Eastern time hits
# 5 am and only if today's branch doesn't already exist, so a missed 09:00 is caught by the 10:00
# firing and a day never runs twice. workflow_dispatch always runs, regardless of the hour.
on:
  schedule:
    - cron: "0 9-10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: kjv27-daily-polish
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check Claude auth is set
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ] && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set. Add one as a repository secret (Settings > Secrets and variables > Actions): CLAUDE_CODE_OAUTH_TOKEN from 'claude setup-token' (needs the CLI), or ANTHROPIC_API_KEY from console.anthropic.com > Settings > API Keys (works from a browser, no CLI needed)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is it time?
        id: when
        run: |
          day=$(TZ=America/New_York date +%F)
          hour=$(TZ=America/New_York date +%H)
          branch="claude/kjv27-$day"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$((10#$hour))" -ne 5 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not yet 5 am Eastern (hour $hour); skipping."
          elif [ "${{ github.event_name }}" = "schedule" ] \
               && git ls-remote --exit-code --heads "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$branch" >/dev/null 2>&1; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "$branch already exists; skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.when.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Run KJV27 daily polish
        if: steps.when.outputs.run == 'true'
        uses: anthropics/claude-code-action@c511ba74c10fdd478854737af777d6aaf10402a0 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read .github/prompts/kjv27-daily-polish.md in this repository and follow it exactly.
            Today's date (America/New_York) is ${{ steps.when.outputs.day }}.
            Your working branch is ${{ steps.when.outputs.branch }}; create it from the latest origin/main.
            You have `git` and the `gh` CLI, already authenticated via GH_TOKEN. Never push to main,
            never force-push, never merge, never enable auto-merge. Open at most one draft PR.
          claude_args: |
            --max-turns 60
            --model claude-sonnet-5-5
            --allowedTools Bash,Read,Write,Edit,Glob,Grep
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        if: always() && steps.when.outputs.run == 'true'
        run: |
          echo "Branch: ${{ steps.when.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
